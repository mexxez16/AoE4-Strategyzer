<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420">
  <!--
    Subtle, tileable parchment texture:
    - fine grain (high-frequency fractal noise, very low alpha)
    - soft mottled blotches (low-frequency noise)
    Rendered on top of the panel background color (#fdf8ec), so the
    result reads as a light, quiet parchment. Tileable via stitchTiles.
  -->
  <defs>
    <filter id="blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="9" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.52
                0 0 0 0 0.42
                0 0 0 0 0.24
                0 0 0 0.9 0" result="c"/>
      <feComponentTransfer in="c" result="a">
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.36
                0 0 0 0 0.20
                0 0 0 0.9 0" result="c"/>
      <feComponentTransfer in="c" result="a">
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="420" height="420" filter="url(#blotch)"/>
  <rect width="420" height="420" filter="url(#grain)"/>
</svg>
